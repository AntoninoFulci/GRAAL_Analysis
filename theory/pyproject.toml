[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graal-theory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
graal-theory = "graal_theory.cli:main"

[tool.setuptools]
packages = ["graal_theory", "graal_theory.amplitudes", "graal_theory.models", "graal_theory.references"]

[tool.setuptools.package-dir]
graal_theory = "src/graal_theory"
"graal_theory.references" = "references"

[tool.setuptools.package-data]
"graal_theory.references" = ["*.json", "*.csv", "*.md"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
