[build-system]
# 64 is where setuptools grew the build_editable hook (PEP 660), which is what
# `pip install -e .` needs. Asking for more buys nothing and only narrows the
# machines this installs on.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graal-analysis"
version = "0.1.0"
description = "GRAAL gamma p -> p eta pi0 analysis pipeline"
# Tied to the Python that PyROOT is built against on the analysis farm (3.10.12).
# PyROOT only imports from the interpreter ROOT was compiled for, so that
# interpreter sets the floor — not our preference. The code itself needs nothing
# newer: modern annotations are all behind `from __future__ import annotations`.
requires-python = ">=3.10"

# The pipeline dirs are numbered so their order is visible on disk, but a
# Python package name cannot start with a digit. This maps one onto the other.
[tool.setuptools]
packages = [
    "graal_common",
    "graal_common.tests",
    "event_selector",
    "analysis",
    "analysis.tests",
    "mc_simulation",
    "mc_simulation.tests",
    "analysis_bdt",
    "analysis_bdt.tests",
    "plots",
    "plots.tests",
]

[tool.setuptools.package-dir]
# 00 is not a pipeline stage: it is what the stages agree on (meson masses, the
# channel registry). Numbered anyway so it sorts above the stages that use it.
graal_common   = "00_common"
event_selector = "02_event_selector"
analysis       = "03_analysis"
mc_simulation  = "04_mc_simulation"
analysis_bdt   = "05_analysis_bdt"
plots          = "06_plots"

[tool.pytest.ini_options]
testpaths = ["00_common/tests", "03_analysis/tests", "04_mc_simulation/tests", "05_analysis_bdt/tests", "06_plots/tests"]
# The tests/ dirs would all collide on the package name "tests" under the
# default import mode, because their numbered parents cannot prefix them.
addopts = "--import-mode=importlib"
