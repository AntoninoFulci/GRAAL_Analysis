[build-system]
# 64 is where setuptools grew the build_editable hook (PEP 660), which is what
# `pip install -e .` needs. Asking for more buys nothing and only narrows the
# machines this installs on.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graal-analysis"
version = "0.1.0"
description = "GRAAL gamma p -> p eta pi0 analysis pipeline"
# Tied to the Python that PyROOT is built against on the analysis farm (3.10.12).
# PyROOT only imports from the interpreter ROOT was compiled for, so that
# interpreter sets the floor — not our preference. The code itself needs nothing
# newer: modern annotations are all behind `from __future__ import annotations`.
requires-python = ">=3.10"

# The pipeline dirs are numbered so their order is visible on disk, but a
# Python package name cannot start with a digit. This maps one onto the other.
#
# Numbers show component order. Some components own several shell stages:
# training (04) owns feature build, search, and fit; reconstruction (05) follows
# it because the BDT-gated entry point consumes the trained model.
[tool.setuptools]
packages = [
    "graal_common",
    "graal_common.physics",
    "graal_common.io",
    "graal_common.calibration",
    "graal_common.stage1",
    "graal_common.tests",
    "event_selector",
    "mc_simulation",
    "mc_simulation.tests",
    "bdt_training",
    "bdt_training.dataset",
    "bdt_training.training",
    "bdt_training.tests",
    "reconstruction",
    "reconstruction.core",
    "reconstruction.runtime",
    "reconstruction.tests",
    "observable_extraction",
    "observable_extraction.calibration",
    "observable_extraction.core",
    "observable_extraction.io",
    "observable_extraction.plotting",
    "observable_extraction.tests",
    "plots",
    "plots.core",
    "plots.tests",
]

[tool.setuptools.package-dir]
# 00 is not a pipeline stage: it is what the stages agree on (meson masses, the
# channel registry). Numbered anyway so it sorts above the stages that use it.
graal_common   = "00_common"
event_selector = "02_event_selector"
mc_simulation  = "03_mc_simulation"
bdt_training   = "04_bdt_training"
reconstruction = "05_reconstruction"
observable_extraction = "06_observable_extraction"
plots          = "06_plots"

[tool.pytest.ini_options]
testpaths = ["tests", "00_common/tests", "03_mc_simulation/tests", "04_bdt_training/tests", "05_reconstruction/tests", "06_observable_extraction/tests", "06_plots/tests"]
# The tests/ dirs would all collide on the package name "tests" under the
# default import mode, because their numbered parents cannot prefix them.
addopts = "--import-mode=importlib"
