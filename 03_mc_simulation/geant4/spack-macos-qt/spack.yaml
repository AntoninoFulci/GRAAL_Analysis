spack:
  specs:
  - graal.geant4@11.4.3 +qt ~opengl +data +examples +threads cxxstd=17 ^qt-base@6.11.2
  repos:
    graal: $env/repository/spack_repo/graal
  view: false
  concretizer:
    unify: true
  packages:
    qt-base:
      buildable: false
      externals:
      - spec: qt-base@6.11.2 +accessibility +gui +opengl +widgets +framework +shared
        prefix: /opt/homebrew/opt/qtbase
